name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workora
          POSTGRES_DB: workora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:workora@localhost:5432/workora_test
      AUTH_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-ci-0123456
      BASE_URL: http://localhost:3010
      WEB_APP_URL: http://localhost:3000
      AUTH_BASE_URL: http://localhost:3010
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (in-memory smoke against Postgres)
        run: npm test

      - name: Boot API against a fresh database and verify
        run: |
          npm run migrate
          node --import tsx src/server.ts &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3010/healthz
          curl -fsS http://localhost:3010/api/v1/categories | grep -q '"success":true'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3010/api/v1/projects
